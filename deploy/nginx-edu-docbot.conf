# /etc/nginx/sites-available/edu-docbot
# EDU-DOCBOT — cấu hình nginx theo thiết kế mục 8.
# Kích hoạt: ln -s ../sites-available/edu-docbot sites-enabled/ && nginx -t && systemctl reload nginx

server {
    listen 80;
    # `_` = nhận mọi Host → chạy được bằng IP tĩnh, chưa cần tên miền.
    # Có tên miền rồi thì đổi thành tên miền thật rồi chạy `certbot --nginx`.
    server_name _;

    client_max_body_size 100m;

    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # BẮT BUỘC cho SSE. Quên dòng này là lỗi triển khai hay gặp nhất:
        # chat đứng im rồi hiện hết một lúc.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }

    location = /healthz { proxy_pass http://127.0.0.1:8080; }
    location = /readyz  { proxy_pass http://127.0.0.1:8080; }

    # --- File tài liệu -----------------------------------------------------
    # `internal`: chỉ vào được qua X-Accel-Redirect do backend phát sau khi đã
    # kiểm quyền. Truy cập thẳng URL này nhận 404.
    location /protected-files/ {
        internal;
        alias /srv/edu-docbot/files/;
    }

    # --- Web tĩnh ----------------------------------------------------------
    location / {
        root /srv/edu-docbot/web;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
